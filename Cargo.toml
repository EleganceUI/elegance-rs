[workspace]
resolver = "2"
# Use a glob: a literal elegance-wgpu member also includes its descendants,
# overriding the exclusion of the nested wgpu workspace below.
members = ["elegance-*", "elegance", "cargo-elegance"]
exclude = ["elegance-wgpu/wgpu"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/EleganceUI/elegance-rs"
rust-version = "1.88"
