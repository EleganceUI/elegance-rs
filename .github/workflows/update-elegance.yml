# Moves the Elegance commit the bindings pin (elegance-sys/native/elegance-rev) to Elegance's
# latest main, so backend fixes reach Rust users without a shim change. It builds and publishes the
# native library for the new commit first (native.yml), and only then commits the pin: a checkout
# never pins an Elegance whose prebuilt library doesn't exist yet.
#
# A change to Elegance that needs shim (or other bindings) changes comes with an elegance-rs branch
# of the same name as the Elegance branch it's merged from; Elegance's linux.yml checks that branch's
# shim on the pull request. Here, that branch is built instead of main, and merged into main
# together with the pin, then deleted. Without one, main is built as it is.
#
# Users pick it up with `cargo update -p elegance` (git dependencies); a vX.Y.Z release keeps what
# it pinned. Elegance's notify-bindings.yml starts it after each push to Elegance's main (a
# repository_dispatch event of type "elegance-updated" with the commit and the merged branch, once
# Elegance has the ELEGANCE_RS_TOKEN secret); the schedule catches anything else. It can also be
# run by hand with a branch, tag, or commit, and an elegance-rs branch to merge.
name: Update Elegance

on:
    schedule:
        - cron: "23 */6 * * *"
    workflow_dispatch:
        inputs:
            rev:
                description: Elegance branch, tag, or full commit hash (default main)
                type: string
                required: false
            branch:
                description: elegance-rs branch with the bindings changes it needs, merged with the pin (default none)
                type: string
                required: false
    repository_dispatch:
        types: [elegance-updated]

permissions:
    contents: write
    actions: write # native.yml deletes superseded caches

# Not native.yml's group: a called workflow in the caller's group would wait on it forever.
concurrency:
    group: update-elegance
    cancel-in-progress: false

jobs:
    check:
        runs-on: ubuntu-latest
        outputs:
            rev: ${{ steps.check.outputs.rev }}
            changed: ${{ steps.check.outputs.changed }}
            bindings_branch: ${{ steps.bindings.outputs.branch }}
            bindings_sha: ${{ steps.bindings.outputs.sha }}
        steps:
            - uses: actions/checkout@v7
            # main as it is now, not as it was when this run was queued: an earlier run may have
            # moved the pin since.
            - name: Current main
              run: git fetch --quiet --depth 1 origin main
            - id: check
              env:
                  WANTED: ${{ inputs.rev || github.event.client_payload.rev || 'main' }}
              run: |
                  pinned=$(git show origin/main:elegance-sys/native/elegance-rev | head -n 1 | tr -d '\r[:space:]')
                  url=https://github.com/${{ github.repository_owner }}/elegance
                  if [[ "$WANTED" =~ ^[0-9a-f]{40}$ ]]; then
                    rev=$WANTED
                  else
                    # A branch, else an annotated tag's commit (^{}), else a lightweight tag.
                    refs=$(git ls-remote "$url" "refs/heads/$WANTED" "refs/tags/$WANTED" "refs/tags/$WANTED^{}")
                    for ref in "refs/heads/$WANTED" "refs/tags/$WANTED^{}" "refs/tags/$WANTED"; do
                      rev=$(awk -v r="$ref" '$2 == r { print $1 }' <<< "$refs")
                      [ -n "$rev" ] && break
                    done
                  fi
                  [ -n "$rev" ] || { echo "::error::$WANTED isn't a branch, tag, or full commit hash of $url"; exit 1; }
                  echo "Pinned: $pinned. $WANTED: $rev."
                  echo "rev=$rev" >> "$GITHUB_OUTPUT"
                  if [ "$rev" = "$pinned" ]; then echo "changed=false"; else echo "changed=true"; fi >> "$GITHUB_OUTPUT"
            - uses: actions/checkout@v7
              if: steps.check.outputs.changed == 'true'
              with:
                  repository: ${{ github.repository_owner }}/elegance
                  ref: ${{ steps.check.outputs.rev }}
                  path: upstream
            # The elegance-rs commit to build: the matching branch's, else main's. Its exact commit,
            # so what's merged later is what was built. Its shim must compile against the new
            # Elegance, checked here in a minute rather than by every native build. A matching
            # branch can still be on its way (pushed after the Elegance merge): while main's shim
            # doesn't compile, wait for it.
            - id: bindings
              if: steps.check.outputs.changed == 'true'
              env:
                  BRANCH: ${{ inputs.branch || github.event.client_payload.branch }}
                  REV: ${{ steps.check.outputs.rev }}
                  CXX: g++-14
              run: |
                  # The checks below check out other commits; keep this one's script.
                  check=$RUNNER_TEMP/check-shim.sh
                  cp .github/scripts/check-shim.sh "$check"
                  [ "$BRANCH" = main ] && BRANCH=
                  deadline=$((SECONDS + 30 * 60))
                  while :; do
                    branch='' sha=''
                    if [ -n "$BRANCH" ]; then
                      sha=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
                      [ -n "$sha" ] && branch=$BRANCH
                    fi
                    [ -n "$sha" ] || sha=$(git ls-remote origin refs/heads/main | cut -f1)
                    git fetch --quiet --depth 1 origin "$sha"
                    git checkout --quiet --detach FETCH_HEAD
                    if "$check" upstream; then break; fi
                    if [ -n "$BRANCH" ] && [ -z "$branch" ] && [ "$SECONDS" -lt "$deadline" ]; then
                      echo "elegance-rs's main doesn't compile against Elegance ${REV:0:12} and there's no $BRANCH branch yet: waiting for it."
                      sleep 60
                      continue
                    fi
                    echo "::error::The shim on elegance-rs's ${branch:-main} (${sha:0:12}) doesn't compile against Elegance ${REV:0:12}. Push an elegance-rs branch with the shim changes it needs${BRANCH:+ (named $BRANCH)}, then run this workflow by hand with rev ${REV:0:12} and that branch."
                    exit 1
                  done
                  if [ -n "$branch" ]; then
                    echo "Building elegance-rs's $branch (${sha:0:12}), to merge with the pin."
                  else
                    [ -n "$BRANCH" ] && echo "No elegance-rs branch $BRANCH: building main."
                  fi
                  echo "branch=$branch" >> "$GITHUB_OUTPUT"
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"

    build:
        needs: check
        if: needs.check.outputs.changed == 'true'
        uses: ./.github/workflows/native.yml
        with:
            elegance_rev: ${{ needs.check.outputs.rev }}
            bindings_ref: ${{ needs.check.outputs.bindings_sha }}

    pin:
        needs: [check, build]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: main
                  fetch-depth: 0
            # Pushed with the workflow's token, which starts no other workflow: the library for this
            # pin is already published.
            - name: Merge and commit the pin
              env:
                  REV: ${{ needs.check.outputs.rev }}
                  BRANCH: ${{ needs.check.outputs.bindings_branch }}
                  BUILT: ${{ needs.check.outputs.bindings_sha }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  if [ -n "$BRANCH" ]; then
                    git merge --no-ff "$BUILT" -m "Merge $BRANCH for Elegance ${REV:0:12}" || {
                      echo "::error::elegance-rs's $BRANCH doesn't merge cleanly into main. Merge main into it and push; the next run (or a manual one with rev ${REV:0:12} and branch $BRANCH) pins it."
                      exit 1
                    }
                  fi
                  # The library's hash covers the shim too: if main's shim changed since the commit
                  # built (or merging brought in other shim changes), the new pin with this shim has
                  # no library yet. The next run redoes it (from a branch: merge main into it, then
                  # run this by hand with rev and branch).
                  if ! git diff --quiet "$BUILT" HEAD -- elegance-sys/shim; then
                    echo "::warning::The shim on main${BRANCH:+ merged with $BRANCH} differs from the one built (${BUILT:0:12}); not pinning ${REV:0:12} yet."
                    exit 0
                  fi
                  echo "$REV" > elegance-sys/native/elegance-rev
                  git commit -am "Update Elegance to ${REV:0:12}" \
                    -m "The native library for it is published; see EleganceUI/elegance@$REV."
                  git push origin HEAD:main
                  # Merged: a later Elegance branch of the same name starts a new one.
                  if [ -n "$BRANCH" ]; then git push origin --delete "$BRANCH"; fi
