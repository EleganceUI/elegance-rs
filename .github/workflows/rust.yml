# Checks, lints and tests the Rust crates on each desktop platform, against the prebuilt C library
# Elegance publishes for the commit elegance-sys/elegance-rev pins. The tests check that the
# structs declared here have the C API's layouts (elg_layouts_*), so a pin bump that changes them
# fails here, on its pull request. ELEGANCE_PREBUILT=1: a pin whose library isn't published fails
# rather than building Elegance from source (about half an hour per platform).
name: Rust

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: rust-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    ELEGANCE_PREBUILT: "1"

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                # Ubuntu 22.04: the prebuilt library needs glibc 2.35+.
                runner: [ubuntu-22.04, macos-15, windows-2025]
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy
            - uses: Swatinem/rust-cache@v2
            # Cargo copies the library beside test binaries; on Linux they find it via an rpath.
            - name: Linux rpath
              if: runner.os == 'Linux'
              shell: bash
              run: echo 'RUSTFLAGS=-C link-args=-Wl,-rpath,$ORIGIN' >> "$GITHUB_ENV"
            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings
            - name: Test
              run: cargo test --workspace
