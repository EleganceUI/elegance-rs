# Builds the prebuilt native library (elegance-sys/native: the shim and Elegance in one shared
# library) for each target, and publishes the archives that elegance-sys's build script downloads
# (build_prebuilt.rs):
#
#   push to main   a prerelease tagged native-<hash, 12 hex digits>
#   tag v*         the release for that tag
#   called by update-elegance.yml with a newer Elegance commit: its prerelease, published before
#                  that workflow moves the pin to it
#
# Each archive bundles the Elegance commit elegance-sys/native/elegance-rev pins, and the hash
# covers the shim sources and that pin (BUILDINFO in the archive records both repositories'
# commits).
name: Native library

on:
    push:
        branches: [main]
        tags: ["v*"]
        paths: [elegance-sys/shim/**, elegance-sys/native/**, .github/workflows/native.yml]
    workflow_dispatch:
    workflow_call:
        inputs:
            elegance_rev:
                description: Build this Elegance commit instead of the pinned one (written into elegance-rev first)
                type: string
                required: false

permissions:
    contents: write
    actions: write # deleting superseded caches

# One run at a time per branch or tag (also when update-elegance.yml calls this), so each starts
# from the previous one's cache.
concurrency:
    group: native-library-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    # Ubuntu 22.04 (glibc 2.35) so the library loads on older distributions too.
                    - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, triplet: x64-linux }
                    - {
                          target: aarch64-unknown-linux-gnu,
                          runner: ubuntu-22.04-arm,
                          triplet: arm64-linux,
                      }
                    - {
                          target: aarch64-apple-darwin,
                          runner: macos-15,
                          triplet: arm64-osx,
                          osx_arch: arm64,
                      }
                    - {
                          target: x86_64-apple-darwin,
                          runner: macos-15,
                          triplet: x64-osx,
                          osx_arch: x86_64,
                      }
                    - {
                          target: x86_64-pc-windows-msvc,
                          runner: windows-2025,
                          triplet: x64-windows-static,
                          msvc_arch: amd64,
                      }
                    - {
                          target: aarch64-pc-windows-msvc,
                          runner: windows-11-arm,
                          triplet: arm64-windows-static,
                          msvc_arch: arm64,
                      }
        runs-on: ${{ matrix.runner }}
        continue-on-error: ${{ matrix.experimental == true }}
        env:
            VCPKG_ROOT: ${{ github.workspace }}/vcpkg
            VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v7
              with:
                  path: elegance-rs
            # The pinned Elegance, or the candidate update-elegance.yml passes (pinned here first, so
            # the library's hash is the one the pin commit will have).
            - name: Elegance revision
              id: rev
              run: |
                  pin=elegance-rs/elegance-sys/native/elegance-rev
                  if [ -n "${{ inputs.elegance_rev }}" ]; then echo "${{ inputs.elegance_rev }}" > "$pin"; fi
                  echo "rev=$(head -n 1 "$pin" | tr -d '\r[:space:]')" >> "$GITHUB_OUTPUT"
            - uses: actions/checkout@v7
              with:
                  repository: ${{ github.repository_owner }}/elegance
                  ref: ${{ steps.rev.outputs.rev }}
                  path: elegance

            - name: Install tools (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends \
                    gcc-14 g++-14 ninja-build pkg-config autoconf autoconf-archive automake libtool libltdl-dev python3-jinja2 \
                    libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
                    libxinerama-dev libx11-xcb-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev \
                    libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
                    libasound2-dev libpulse-dev libdbus-1-dev libibus-1.0-dev libudev-dev libcurl4-openssl-dev
                  pipx install 'cmake>=4.3'
                  echo "CC=gcc-14" >> "$GITHUB_ENV"
                  echo "CXX=g++-14" >> "$GITHUB_ENV"

            # Xcode 16's libc++ lacks std::jthread / std::stop_token.
            - uses: maxim-lobanov/setup-xcode@v1
              if: runner.os == 'macOS'
              with:
                  xcode-version: "26"
            - name: Install tools (macOS)
              if: runner.os == 'macOS'
              run: brew install cmake ninja pkgconf

            - uses: ilammy/msvc-dev-cmd@v1
              if: runner.os == 'Windows'
              with:
                  arch: ${{ matrix.msvc_arch }}
            # The developer environment points VCPKG_ROOT at Visual Studio's bundled vcpkg, overriding
            # the job's: point it back at ours.
            - name: Install tools (Windows)
              if: runner.os == 'Windows'
              run: |
                  pipx install 'cmake>=4.3' ninja
                  echo "CXX=cl" >> "$GITHUB_ENV"
                  echo "VCPKG_ROOT=${{ github.workspace }}/vcpkg" >> "$GITHUB_ENV"

            - name: Set up vcpkg
              run: |
                  git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
                  baseline=$(python3 -c 'import json; print(json.load(open("elegance/vcpkg.json"))["builtin-baseline"])')
                  git -C "$VCPKG_ROOT" checkout "$baseline"
                  if [ "$RUNNER_OS" = Windows ]; then "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics; else "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics; fi
                  mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

            # The library is a Release build, so build the dependencies in Release only: half of
            # Dawn's build time and cache size. The triplets keep their names (the Windows ones
            # must end in -static), starting from Elegance's overlay or vcpkg's own.
            - name: Release-only triplets
              run: |
                  mkdir -p triplets
                  t=${{ matrix.triplet }}
                  for base in "elegance/cmake/triplets/$t.cmake" "$VCPKG_ROOT/triplets/$t.cmake" "$VCPKG_ROOT/triplets/community/$t.cmake"; do
                    if [ -f "$base" ]; then cp "$base" "triplets/$t.cmake"; break; fi
                  done
                  echo 'set(VCPKG_BUILD_TYPE release)' >> "triplets/$t.cmake"
                  cat "triplets/$t.cmake"

            # Restore the newest binary cache; a unique save key lets ABI changes refresh it
            # instead of leaving an immutable exact-match cache missing the rebuilt packages.
            - name: Restore vcpkg binaries
              id: vcpkg-cache
              uses: actions/cache/restore@v6
              with:
                  path: ${{ github.workspace }}/vcpkg-cache
                  key: vcpkg-native-v3-${{ matrix.target }}-${{ matrix.runner }}-${{ hashFiles('elegance/vcpkg.json', 'triplets/*.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: |
                      vcpkg-native-v3-${{ matrix.target }}-${{ matrix.runner }}-${{ hashFiles('elegance/vcpkg.json', 'triplets/*.cmake') }}-
                      vcpkg-native-v3-${{ matrix.target }}-${{ matrix.runner }}-

            - name: Configure (build or restore dependencies)
              id: configure
              run: |
                  args=()
                  [ -n "${{ matrix.osx_arch }}" ] && args+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3)
                  cmake -S elegance-rs/elegance-sys/native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
                    -DELEGANCE_ROOT="$PWD/elegance" -DVCPKG_MANIFEST_DIR="$PWD/elegance" \
                    -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
                    -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets" -DELG_NATIVE_REQUIRE_PIN=ON \
                    "${args[@]}"

            # Keep only the archives this build installed (each is named after the SHA-256 of its
            # package's vcpkg_abi_info.txt). Otherwise every superseded build stays in the cache, which
            # grows past GitHub's 10 GB per repository and gets the other targets' caches evicted.
            - name: Prune vcpkg binaries
              if: ${{ steps.configure.outcome == 'success' }}
              run: |
                  sum() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -c1-64; }
                  cache=$VCPKG_DEFAULT_BINARY_CACHE
                  command -v cygpath >/dev/null && cache=$(cygpath -u "$cache")
                  keep=$(for f in build/vcpkg_installed/*/share/*/vcpkg_abi_info.txt; do sum "$f"; done)
                  [ -n "$keep" ] || { echo "No installed packages found: not pruning"; exit 0; }
                  find "$cache" -name '*.zip' | while read -r zip; do
                    grep -qx "$(basename "$zip" .zip)" <<< "$keep" || rm -f "$zip"
                  done
                  du -sh "$cache"

            # CMake configuration installs vcpkg dependencies. Preserve completed packages
            # even if configuration or the subsequent native build fails.
            - name: Save vcpkg binaries
              id: save
              if: ${{ !cancelled() && steps.vcpkg-cache.outputs.cache-primary-key != '' }}
              uses: actions/cache/save@v6
              with:
                  path: ${{ github.workspace }}/vcpkg-cache
                  key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

            # Each run saves under a new key: drop this target's older ones (earlier key versions
            # included), so main keeps one per target.
            - name: Delete superseded vcpkg caches
              if: ${{ steps.save.outcome == 'success' && github.ref == 'refs/heads/main' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  CURRENT: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
              run: |
                  gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "vcpkg-native-" --limit 100 --json id,key \
                    --jq ".[] | select(.key != \"$CURRENT\" and (.key | contains(\"-${{ matrix.target }}-\"))) | .id" |
                    while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done

            - name: Build
              run: |
                  cmake --build build
                  cmake --install build --prefix dist

            - name: Package
              run: |
                  {
                    echo "target ${{ matrix.target }}"
                    echo "elegance $(git -C elegance rev-parse HEAD)"
                    echo "elegance-rs $(git -C elegance-rs rev-parse HEAD)"
                  } > dist/BUILDINFO
                  tar -czf elegance-native-${{ matrix.target }}.tar.gz -C dist .
            - uses: actions/upload-artifact@v7
              with:
                  name: elegance-native-${{ matrix.target }}
                  path: elegance-native-${{ matrix.target }}.tar.gz

    publish:
        needs: build
        # Publish what built, even if an experimental target failed.
        if: ${{ !cancelled() }}
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        steps:
            - uses: actions/download-artifact@v8
              with:
                  path: archives
                  merge-multiple: true
            - name: Publish
              run: |
                  set -e
                  ls archives
                  first=$(ls archives/*.tar.gz | head -n 1)
                  hash=$(tar -xzOf "$first" ./native.sha256 | cut -c1-12)
                  elegance=$(tar -xzOf "$first" ./BUILDINFO | sed -n 's/^elegance //p')
                  if [ "${{ github.ref_type }}" = tag ]; then
                    tag="${{ github.ref_name }}"
                    gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --title "$tag" --generate-notes
                  else
                    tag="native-$hash"
                    gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --target "${{ github.sha }}" \
                      --title "Native library $hash" \
                      --notes "Prebuilt native libraries for elegance-sys: its shim with Elegance ${elegance:0:12} (EleganceUI/elegance@$elegance). Published automatically."
                  fi
                  gh release upload "$tag" archives/*.tar.gz --clobber
