[package]
name = "elegence-sys"
description = "Raw bindings to Elegence through a small C++ shim (for the `elegence` crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
links = "elegence"
build = "build.rs"

[build-dependencies]
cc = "1.2"

[features]
# Link elegence.dll (a shared build of Elegence) instead of the static library: what the preview
# host and hot reload need, since a views module must share the host's Elegence.
dynamic = []
