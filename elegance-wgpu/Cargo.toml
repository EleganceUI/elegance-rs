[package]
name = "elegance-wgpu"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
rust-version = "1.93"
description = "Bounded, zero-CPU-copy wgpu image publication for Elegance"

[dependencies]
elegance = { path = "../elegance" }
elegance-sys = { path = "../elegance-sys" }
wgpu = { path = "wgpu/wgpu", default-features = false, features = ["std", "parking_lot", "metal", "dx12", "vulkan", "wgsl"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-core-foundation = "0.3.2"
objc2-io-surface = "0.3.2"
objc2-metal = { version = "0.3.2", features = ["objc2-io-surface"] }
